# Pipeline de integración continua de PQRSD Coffee Devs.
#
# Corre en cada pull request hacia main o develop y en cada push a esas ramas.
# Para que BLOQUEE el merge a main hay que marcar estos jobs como
# "required status checks" en la regla de protección de main (ver README).
# Los nombres de los jobs (name:) son los que aparecen en esa configuración:
# no los cambies sin actualizar la regla.

name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]
  workflow_dispatch: # permite lanzarlo a mano desde la pestaña Actions

# Si llega un push nuevo al mismo PR, se cancela la corrida anterior.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secretos:
    name: Secretos fuera del repo
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # historial completo para revisarlo
      - name: Sin archivos .env ni .pem versionados
        run: |
          if git ls-files | grep -E '(^|/)\.env$|\.pem$'; then
            echo "::error::Hay archivos .env o .pem en el repositorio"; exit 1
          fi
      - name: Sin API keys ni llaves privadas en el historial
        run: |
          if git log -p --all | grep -iE 'sk-[a]nt-|BEGIN [A-Z ]*PRIVATE [K]EY'; then
            echo "::error::Se encontró algo parecido a una clave. Revócala y genera otra (ver README)."; exit 1
          fi

  backend:
    name: Backend (lint y pruebas)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      db:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: pqrsd
          POSTGRES_PASSWORD: pqrsd
          POSTGRES_DB: pqrsd_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U pqrsd -d pqrsd_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    defaults:
      run:
        working-directory: backend
    env:
      # Valores falsos solo para CI; nunca claves reales.
      ANTHROPIC_API_KEY: clave-falsa-para-ci
      DB_URL: postgresql+psycopg://pqrsd:pqrsd@localhost:5432/pqrsd_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Instalar dependencias
        run: pip install -r requirements-dev.txt
      - name: Lint (ruff)
        run: ruff check .
      - name: Pruebas (pytest)
        run: pytest

  frontend:
    name: Frontend (build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run build

  docker:
    name: Docker compose (humo)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Crear .env de prueba a partir de .env.example
        run: |
          cp .env.example .env
          sed -i 's/^ANTHROPIC_API_KEY=.*/ANTHROPIC_API_KEY=clave-falsa-para-ci/' .env
      - name: Levantar todos los servicios
        run: docker compose up --build -d --wait --wait-timeout 180
      - name: /api/health responde con la base conectada
        run: |
          respuesta=$(curl -s --retry 5 --retry-delay 3 --retry-all-errors http://localhost/api/health)
          echo "$respuesta"
          test "$respuesta" = '{"estado":"ok","db":true}'
      - name: El frontend responde 200
        run: test "$(curl -s -o /dev/null -w '%{http_code}' http://localhost/)" = "200"
      - name: Existen las cuatro tablas
        run: |
          docker compose exec -T db psql -U pqrsd -d pqrsd -tAc \
            "SELECT count(*) FROM information_schema.tables WHERE table_name IN ('pqrsd','borradores','revisiones','fragmentos_conocimiento')" \
            | grep -qx 4
      - name: Logs si algo falla
        if: failure()
        run: docker compose logs --no-color
      - name: Apagar
        if: always()
        run: docker compose down -v
